  </div>

  <div class="chat-page">
    <div class="chat-box">
      <div class="chat-header">💬 AI节气顾问</div>
      <div class="quick-qs">
        <button data-q="哪个节气升温最快？">哪个节气升温最快？</button>
        <button data-q="冬天为什么越来越暖？">冬天为什么越来越暖？</button>
        <button data-q="清明还会下雨吗？">清明还会下雨吗？</button>
        <button data-q="节气现在还准确吗？">节气现在还准确吗？</button>
        <button data-q="昼夜长短怎么变化？">昼夜长短怎么变化？</button>
        <button data-q="立春有什么习俗？">立春有什么习俗？</button>
      </div>
      <div class="chat-msgs" id="chatMsgs">
        <div class="chat-msg ai"><div class="bubble">你好！我是AI节气顾问。二十四节气是古人智慧的结晶，被列入联合国教科文组织人类非物质文化遗产代表作名录。在气候变化的今天，很多节气的物候已经发生了变化。你可以问我任何关于节气、物候、气候的问题，也可以点击上方快捷问题快速开始。</div></div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="输入你的问题，如：冬至为什么要吃饺子？">
        <button id="chatSend">发送</button>
      </div>
    </div>
  </div>
</div>

<button class="back-top" id="backTop">↑</button>

<footer>
  <div class="footer-gold">Horae</div>
  <p><a href="https://github.com/runner-cpu/Horae" target="_blank" rel="noopener noreferrer" style="color:var(--gold);text-decoration:none;">🔗 GitHub 仓库</a> · 数据可视化竞赛作品 · AI回答基于节气数据与气候知识</p>
</footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
const responses = {
  '升温最快': '升温最快的节气是<strong>立冬、冬至、小寒、大寒</strong>等冬季节气，升温幅度普遍在+2.2°C至+2.3°C之间。\n\n其中<strong>立冬</strong>和<strong>冬至</strong>升温最为显著，均达到+2.3°C。\n\n这反映了全球气候变化中"冬季升温快于夏季、北方升温快于南方"的典型特征。冬季的快速升温导致入冬推迟、初雪延后、结冰期缩短。',
  '冬天': '冬天越来越暖是气候变化最显著的特征之一。\n\n数据显示：\n- 冬季节气平均升温约<strong>+2.2°C</strong>，远高于夏季的+1.6°C\n- 全国平均入冬日期推迟约7-10天\n- 初雪日期推迟约15天\n- 暖冬频率显著增加\n\n原因包括北极放大效应、温室气体冬季增温效应更明显、城市化热岛效应等。\n\n"立冬不冷、小雪无雪、大寒不寒"已成为越来越常见的现象。',
  '清明': '"清明时节雨纷纷"是杜牧的千古名句，但在气候变化的今天，这句诗的准确性正在发生变化。\n\n<strong>南方地区：</strong>清明降水依然充沛，"雨纷纷"的景象仍然典型。\n\n<strong>北方地区：</strong>清明降水日数有所减少，春季干旱频率增加，"雨纷纷"已不如从前准确。\n\n当代清明平均气温14.5°C，较过去升高1.5°C。温暖干燥的清明在北方越来越常见。',
  '准确': '二十四节气是古人基于黄河流域的物候和气候总结的时间智慧，在当代仍然具有重要的参考价值，但需要注意以下变化：\n\n<strong>仍然准确的方面：</strong>\n- 太阳黄经的天文划分完全准确\n- 季节转换的大致时间框架仍然适用\n- 农业生产的宏观节奏仍有参考价值\n\n<strong>发生变化的方面：</strong>\n- 具体物候时间普遍提前（春季物候提前约7天）\n- 入冬、入夏等季节开始时间推迟或提前\n- 初霜、初雪等气候事件日期显著推迟\n- 极端天气事件频率增加\n\n节气作为文化符号和时间框架依然珍贵，但具体物候描述需要结合当代气候进行调整。',
  '昼夜': '二十四节气与昼夜长短密切相关：\n\n<strong>春分、秋分：</strong>昼夜均分，各12小时\n<strong>夏至：</strong>白昼最长，约14.6小时（北方更长）\n<strong>冬至：</strong>白昼最短，约9.6小时（北方更短）\n\n从立春到夏至，白昼逐渐变长；从夏至到冬至，白昼逐渐变短。\n\n气候变化对昼夜长短的天文规律没有影响，但会影响昼夜温差——气候变暖导致夜间升温幅度往往大于白天，昼夜温差在缩小。',
  '立春': '立春是二十四节气之首，标志着春季的开始。\n\n<strong>传统习俗：</strong>\n- 咬春：吃春饼、春卷、萝卜，寓意迎接春天\n- 打春牛：用泥塑春牛，鞭打以祈丰收\n- 贴宜春：在门上贴"宜春"二字\n- 迎春：官府举行迎春仪式\n\n<strong>当代气候：</strong>\n- 当代立春平均气温3.2°C，较50年前升高1.4°C\n- 河流解冻期平均提前约8天\n- 虽然"立春"，但全国大部分地区仍处于冬季\n\n立春更多是一个天文和文化上的春天起点，气象学上的春天要等到气温稳定回升。'
};

document.addEventListener('DOMContentLoaded', () => {
  initCommon('chat');
  initChat();
});

function initChat() {
  const input = document.getElementById('chatInput');
  const send = document.getElementById('chatSend');
  const msgs = document.getElementById('chatMsgs');
  
  function addMsg(text, isUser) {
    const div = document.createElement('div');
    div.className = `chat-msg ${isUser ? 'user' : 'ai'}`;
    div.innerHTML = `<div class="bubble">${text.replace(/\n/g,'<br>')}</div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }
  
  function sendMsg() {
    const text = input.value.trim();
    if (!text) return;
    addMsg(text, true);
    input.value = '';
    setTimeout(() => {
      let resp = '这是一个关于节气和气候的好问题。二十四节气是古人智慧的结晶，在气候变化的今天，很多物候都在发生变化。总体来看，冬季节气升温最显著，春季物候普遍提前。你可以问我更具体的问题，比如"哪个节气升温最快"、"清明还会下雨吗"等。';
      for (const key in responses) {
        if (text.includes(key) || key.includes(text.substring(0, 3))) {
          resp = responses[key];
          break;
        }
      }
      addMsg(resp, false);
    }, 700);
  }
  
  send.addEventListener('click', sendMsg);
  input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMsg(); });
  document.querySelectorAll('.quick-qs button').forEach(btn => {
    btn.addEventListener('click', () => { input.value = btn.dataset.q; sendMsg(); });
  });
}
</script>
</body>
</html>
